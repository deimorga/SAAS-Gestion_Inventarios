# Producción — requiere micronuba-infra corriendo (red micronuba_public activa).
# Uso: docker compose -f docker-compose.prod.yml up -d --build
# Variables requeridas en .env → ver .env.prod.example

services:

  api:
    build:
      context: ./core_backend
      dockerfile: Dockerfile.prod
    image: inv-api:prod
    container_name: inv-api
    restart: unless-stopped
    networks:
      - micronuba_public
      - inv_app
      - inv_data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      ENABLE_SWAGGER: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@inv-postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@inv-redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@inv-redis:6379/1
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"
      ADMIN_BOOTSTRAP_SECRET: ${ADMIN_BOOTSTRAP_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME}
      ACTIVATION_BASE_URL: ${ACTIVATION_BASE_URL:-https://admin.inventarios.micronuba.net}
      ACTIVATION_TOKEN_TTL_HOURS: "48"
      API_KEY_EXPIRY_DAYS: "365"
      API_KEY_ROTATION_GRACE_DAYS: "30"
      RESERVATION_TTL_MINUTES: "30"
      WEBHOOK_MAX_ATTEMPTS: "3"
      WEBHOOK_TIMEOUT_SECONDS: "10"
      WEBHOOK_POLL_SECONDS: "10"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=micronuba_public"
      - "traefik.http.routers.inv-api.rule=Host(`api.inventarios.micronuba.net`)"
      - "traefik.http.routers.inv-api.entrypoints=websecure"
      - "traefik.http.routers.inv-api.tls.certresolver=le"
      - "traefik.http.services.inv-api.loadbalancer.server.port=8000"
      - "traefik.http.routers.inv-api.middlewares=inv-ratelimit"
      - "traefik.http.middlewares.inv-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.inv-ratelimit.ratelimit.burst=50"

  worker:
    image: inv-api:prod
    container_name: inv-worker
    restart: unless-stopped
    networks:
      - inv_app
      - inv_data
    command: celery -A app.tasks worker --loglevel=info --concurrency=4 -Q default,webhooks,bulk
    healthcheck:
      disable: true
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@inv-postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@inv-redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@inv-redis:6379/1
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME}
      API_KEY_EXPIRY_DAYS: "365"
      API_KEY_ROTATION_GRACE_DAYS: "30"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    image: inv-api:prod
    container_name: inv-beat
    restart: unless-stopped
    networks:
      - inv_app
    command: celery -A app.tasks beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    healthcheck:
      disable: true
    environment:
      APP_ENV: production
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@inv-redis:6379/1
      REDIS_URL: redis://:${REDIS_PASSWORD}@inv-redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  admin-portal:
    build:
      context: ./web_frontend
      dockerfile: Dockerfile
    image: inv-admin-portal:prod
    container_name: inv-admin-portal
    restart: unless-stopped
    networks:
      - micronuba_public
      - inv_app
    environment:
      API_BASE_URL: http://inv-api:8000
      STORAGE_SECRET: ${STORAGE_SECRET}
      PORT: "8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/')"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=micronuba_public"
      - "traefik.http.routers.inv-admin.rule=Host(`admin.inventarios.micronuba.net`)"
      - "traefik.http.routers.inv-admin.entrypoints=websecure"
      - "traefik.http.routers.inv-admin.tls.certresolver=le"
      - "traefik.http.services.inv-admin.loadbalancer.server.port=8080"

  postgres:
    image: postgres:15-alpine
    container_name: inv-postgres
    restart: unless-stopped
    networks:
      - inv_data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - inv_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init/:/docker-entrypoint-initdb.d/:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: inv-redis
    restart: unless-stopped
    networks:
      - inv_app
      - inv_data
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - inv_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  micronuba_public:
    external: true
  inv_app:
    name: inv_app
    internal: true
  inv_data:
    name: inv_data
    internal: true

volumes:
  inv_postgres_data:
    name: inv_postgres_data
  inv_redis_data:
    name: inv_redis_data
