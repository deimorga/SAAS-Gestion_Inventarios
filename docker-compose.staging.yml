# Staging — branch: develop, directorio VPS: /root/inventory-saas-staging/
# Uso: docker compose -f docker-compose.staging.yml up -d --build
# Variables requeridas en .env → ver .env.staging.example
#
# Diferencias clave vs producción:
#   - ENABLE_SWAGGER=true  (Swagger accesible en /docs)
#   - 2 workers uvicorn y 2 celery (carga menor)
#   - Mailpit disponible en mail-staging.inventarios.micronuba.com
#   - Secrets DEBEN ser distintos a los de producción

services:

  api:
    build:
      context: ./core_backend
      dockerfile: Dockerfile.prod
    image: inv-api:staging
    container_name: inv-api-staging
    restart: unless-stopped
    networks:
      - micronuba_public
      - inv_app_staging
      - inv_data_staging
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    environment:
      APP_ENV: staging
      APP_DEBUG: "false"
      ENABLE_SWAGGER: "true"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@inv-postgres-staging:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@inv-redis-staging:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@inv-redis-staging:6379/1
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"
      ADMIN_BOOTSTRAP_SECRET: ${ADMIN_BOOTSTRAP_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY:-re_staging_placeholder}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-staging@micronuba.com}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME:-MicroNuba Staging}
      ACTIVATION_BASE_URL: ${ACTIVATION_BASE_URL:-https://staging-admin.inventarios.micronuba.com}
      ACTIVATION_TOKEN_TTL_HOURS: "48"
      API_KEY_EXPIRY_DAYS: "365"
      API_KEY_ROTATION_GRACE_DAYS: "30"
      RESERVATION_TTL_MINUTES: "30"
      WEBHOOK_MAX_ATTEMPTS: "3"
      WEBHOOK_TIMEOUT_SECONDS: "10"
      WEBHOOK_POLL_SECONDS: "10"
      SMTP_HOST: inv-mailpit-staging
      SMTP_PORT: "1025"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=micronuba_public"
      - "traefik.http.routers.inv-api-staging.rule=Host(`staging.inventarios.micronuba.com`)"
      - "traefik.http.routers.inv-api-staging.entrypoints=websecure"
      - "traefik.http.routers.inv-api-staging.tls.certresolver=le"
      - "traefik.http.services.inv-api-staging.loadbalancer.server.port=8000"

  worker:
    image: inv-api:staging
    container_name: inv-worker-staging
    restart: unless-stopped
    networks:
      - inv_app_staging
      - inv_data_staging
    command: celery -A app.tasks worker --loglevel=info --concurrency=2 -Q default,webhooks,bulk
    environment:
      APP_ENV: staging
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@inv-postgres-staging:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@inv-redis-staging:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@inv-redis-staging:6379/1
      RESEND_API_KEY: ${RESEND_API_KEY:-re_staging_placeholder}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-staging@micronuba.com}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME:-MicroNuba Staging}
      API_KEY_EXPIRY_DAYS: "365"
      API_KEY_ROTATION_GRACE_DAYS: "30"
      SMTP_HOST: inv-mailpit-staging
      SMTP_PORT: "1025"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    image: inv-api:staging
    container_name: inv-beat-staging
    restart: unless-stopped
    networks:
      - inv_app_staging
    command: celery -A app.tasks beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    environment:
      APP_ENV: staging
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@inv-redis-staging:6379/1
      REDIS_URL: redis://:${REDIS_PASSWORD}@inv-redis-staging:6379/0
    depends_on:
      redis:
        condition: service_healthy

  admin-portal:
    build:
      context: ./web_frontend
      dockerfile: Dockerfile
    image: inv-admin-portal:staging
    container_name: inv-admin-portal-staging
    restart: unless-stopped
    networks:
      - micronuba_public
      - inv_app_staging
    environment:
      API_BASE_URL: http://inv-api-staging:8000
      STORAGE_SECRET: ${STORAGE_SECRET}
      PORT: "8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=micronuba_public"
      - "traefik.http.routers.inv-admin-staging.rule=Host(`staging-admin.inventarios.micronuba.com`)"
      - "traefik.http.routers.inv-admin-staging.entrypoints=websecure"
      - "traefik.http.routers.inv-admin-staging.tls.certresolver=le"
      - "traefik.http.services.inv-admin-staging.loadbalancer.server.port=8080"

  mailpit:
    image: axllent/mailpit:latest
    container_name: inv-mailpit-staging
    restart: unless-stopped
    networks:
      - micronuba_public
      - inv_app_staging
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=micronuba_public"
      - "traefik.http.routers.inv-mailpit-staging.rule=Host(`mail-staging.inventarios.micronuba.com`)"
      - "traefik.http.routers.inv-mailpit-staging.entrypoints=websecure"
      - "traefik.http.routers.inv-mailpit-staging.tls.certresolver=le"
      - "traefik.http.services.inv-mailpit-staging.loadbalancer.server.port=8025"

  postgres:
    image: postgres:15-alpine
    container_name: inv-postgres-staging
    restart: unless-stopped
    networks:
      - inv_data_staging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - inv_postgres_data_staging:/var/lib/postgresql/data
      - ./infra/postgres/init/:/docker-entrypoint-initdb.d/:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: inv-redis-staging
    restart: unless-stopped
    networks:
      - inv_app_staging
      - inv_data_staging
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - inv_redis_data_staging:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  micronuba_public:
    external: true
  inv_app_staging:
    name: inv_app_staging
    internal: true
  inv_data_staging:
    name: inv_data_staging
    internal: true

volumes:
  inv_postgres_data_staging:
    name: inv_postgres_data_staging
  inv_redis_data_staging:
    name: inv_redis_data_staging
